<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso CUCEI - Código QR</title>
  <!-- Script confiable para dibujar QR en HTML Canvas -->
  <script src="https://cdn.jsdelivr.net/npm/kjua@0.9.0/dist/kjua.min.js"></script>
  <!-- Enlace al Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div class="card">
    <h2>Control de Acceso</h2>
    <p>Muestra este código en el lector de la entrada</p>
    
    <div id="qrcode"></div>
    <div class="code-text" id="token-display">------</div>
    
    <div class="timer-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>
  </div>

  <script>
    const USUARIO_ID = 1;

    const qrcodeContainer = document.getElementById('qrcode');
    const tokenDisplay = document.getElementById('token-display');
    const timerBar = document.getElementById('timer-bar');

    async function generarQR() {
      try {
        const response = await fetch(`/api/token-actual/${USUARIO_ID}`);
        if (!response.ok) throw new Error('No se pudo obtener el token');
        const { token } = await response.json();

        const payload = JSON.stringify({ usuario_id: USUARIO_ID, token });
        const qrEl = kjua({ text: payload, size: 200, fill: '#0f172a', back: '#ffffff', rounded: 10 });

        qrcodeContainer.innerHTML = "";
        qrcodeContainer.appendChild(qrEl);
        tokenDisplay.innerText = token;
      } catch (err) {
        console.error("Error al generar el QR:", err);
        qrcodeContainer.innerHTML = '<p class="qr-error">' + err.message + '</p>';
        tokenDisplay.innerText = '------';
      }
    }
    
    function actualizarTemporizador() {
      const epoch = Math.floor(Date.now() / 1000);
      const segundosRestantes = 30 - (epoch % 30);
      const porcentaje = (segundosRestantes / 30) * 100;
      
      timerBar.style.width = porcentaje + '%';

      if (segundosRestantes === 30 || tokenDisplay.innerText === '------') {
        generarQR();
      }
    }

    setInterval(actualizarTemporizador, 1000);
    actualizarTemporizador();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registrado correctamente:', reg.scope))
            .catch((err) => console.error('Error al registrar Service Worker:', err));
        });
    }
  </script>
</body>
</html>
